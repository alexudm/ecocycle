<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тепличный комплекс | EcoCycle Агро</title>
    <meta name="description" content="50 гектаров теплиц пятого поколения. Нулевые затраты на тепло благодаря интеграции с заводом.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://alexudm.github.io/ecocycle/greenhouse.html">
    <link rel="alternate" hreflang="ru" href="https://alexudm.github.io/ecocycle/greenhouse.html">
    <link rel="alternate" hreflang="en" href="https://alexudm.github.io/ecocycle/en/greenhouse.html">
    <link rel="alternate" hreflang="x-default" href="https://alexudm.github.io/ecocycle/greenhouse.html">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="lang-switch" aria-label="Выбор языка">
            <a href="greenhouse.html" class="active" aria-current="page">RU</a>
            <a href="en/greenhouse.html">EN</a>
        </nav>
    </header>

    <main class="container page-detail">
        <a href="index.html" class="back-link">← Вернуться к структуре</a>

        <article class="node theme-plant">
            <h1 class="page-title">Высокотехнологичный тепличный комплекс</h1>
            <div class="img-placeholder">
                <img src="greenhouse_view.webp" alt="Панорамный вид тепличного комплекса площадью 50 гектаров с модульной структурой" loading="lazy">
            </div>

            <div class="card card-highlight">
                <h3>Энергообеспечение (на 1 модуль):</h3>
                <ul class="spec-list">
                    <li>Тепло: <b>3 500 000 kcal (от завода)</b></li>
                    <li>Электроэнергия: <b>0.90 MW (автономно)</b></li>
                    <li>Себестоимость: <b>На 35% ниже рыночной</b></li>
                </ul>
            </div>

            <h3 class="section-title">Прогноз урожайности (в год):</h3>
            <div class="branch-container">
                <div class="card card-stat">
                    <h4>Томаты: 750 т/га</h4>
                </div>
                <div class="card card-stat">
                    <h4>Огурцы: 1.8 млн шт</h4>
                </div>
            </div>

            <div class="img-placeholder img-placeholder-spaced">
                <img src="strawberry_tech.webp" alt="Многоярусная гидропонная система выращивания клубники в тепличном модуле" loading="lazy">
            </div>
        </article>
    </main>
    <script src="script.js"></script>
