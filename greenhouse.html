<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тепличный комплекс | EcoCycle Агро</title>
    <meta name="description" content="50 Гектаров теплиц пятого поколения. Нулевые затраты на тепло благодаря интеграции с заводом.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="text-align: left;">
        <a href="index.html" class="back-link">← Вернуться к структуре</a>
        
        <div class="node" style="border-color: var(--primary);">
            <h1>Высокотехнологичный тепличный комплекс</h1>
            <div class="img-placeholder">
                <img src="greenhouse_view.webp" alt="Тепличный комплекс">
            </div>

            <div class="card" style="background: rgba(46, 204, 113, 0.05);">
                <h3>Энергообеспечение (на 1 модуль):</h3>
                <ul class="spec-list">
                    <li>Тепло: <b>3 500 000 kcal (от завода)</b></li>
                    <li>Электроэнергия: <b>0.90 MW (автономно)</b></li>
                    <li>Себестоимость: <b>На 35% ниже рыночной</b></li>
                </ul>
            </div>

            <h3>Прогноз урожайности (в год):</h3>
            <div class="branch-container">
                <div class="card" style="flex: 1; min-width: 200px; border-top: 3px solid var(--primary);">
                    <h4>Томаты: 750 т/га</h4>
                </div>
                <div class="card" style="flex: 1; min-width: 200px; border-top: 3px solid var(--primary);">
                    <h4>Огурцы: 1.8 млн шт</h4>
                </div>
            </div>

            <div class="img-placeholder" style="margin-top: 30px;">
                <img src="strawberry_tech.webp" alt="Вертикальная гидропоника">
            </div>
        </div>
    </div>
	<script src="script.js"></script>


</body>
</html>
