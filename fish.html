<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Осетровая ферма | EcoCycle Аквакультура</title>
    <meta name="description" content="Производство 10 тонн осетра ежемесячно. Технология УЗВ с контролем среды.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="text-align: left;">
        <a href="index.html" class="back-link" style="border-color: var(--accent); color: var(--accent);">← Назад</a>
        
        <div class="node" style="border-color: var(--accent);">
            <h1 style="color: var(--accent);">Промышленная осетровая ферма</h1>
            <div class="img-placeholder">
                <img src="sturgeon_main.webp" alt="Товарный осетр">
            </div>

            <div class="card">
                <h3>Технология УЗВ</h3>
                <ul class="spec-list">
                    <li>Мощность: <b>10 тонн / месяц</b></li>
                    <li>Температура воды: <b>18–20°C (стабильно)</b></li>
                    <li>Вес особи: <b>1 – 5 кг</b></li>
                </ul>
            </div>

            <h3 style="color: var(--accent);">Схема системы водоснабжения</h3>
            <div class="card" style="background: #fff; padding: 15px;">
                <img src="uzv_scheme.webp" alt="Схема УЗВ" style="width: 100%;">
            </div>
        </div>
    </div>
	<script src="script.js"></script>


</body>
</html>
